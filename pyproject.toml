[project]
name = "cozette-rebuild"
version = "0.0.0"
requires-python = ">=3.15"

dependencies = [
    "pixel-font-knife==0.0.35",
    "sfdfont==0.0.1",
    "loguru==0.8.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
